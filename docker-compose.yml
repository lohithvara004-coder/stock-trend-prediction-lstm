version: "3.8"

services:
  trendpulse-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: trendpulse-ai:latest
    container_name: trendpulse_app
    ports:
      - "8501:8501"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DEFAULT_TICKER=AAPL
      - CACHE_TTL_SECONDS=3600
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M
        reservations:
          cpus: "0.5"
          memory: 1024M
